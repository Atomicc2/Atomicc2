name: Update GitHub Stats SVG

on:
  schedule:
    - cron: '0 * * * *'   # roda a cada 1 hora
  workflow_dispatch:        # permite rodar manualmente

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar estatísticas
        run: |
          curl -s "https://github-readme-stats.vercel.app/api?username=Atomicc2&show_icons=true&theme=dracula&include_all_commits=true&count_private=true" -o stats.svg
          curl -s "https://github-readme-stats.vercel.app/api/top-langs/?username=Atomicc2&layout=compact&langs_count=7&theme=dracula" -o top-langs.svg
          curl -s "https://github-readme-streak-stats.herokuapp.com/?user=Atomicc2&theme=dracula" -o streak.svg

      - name: Commitar se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg top-langs.svg streak.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualiza estatísticas do GitHub" && git push)
